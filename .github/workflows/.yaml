name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- C++ ----------
      - name: Configure C++
        run: cmake -S core -B build/core

      - name: Build C++
        run: cmake --build build/core --config Release

      - name: Run tests
        shell: bash
        run: ./scripts/check_no_raw_new_delete.sh

      # ---------- Python ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./py
